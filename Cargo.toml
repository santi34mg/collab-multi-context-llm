[package]
name = "agent-collab"
version = "0.1.0"
edition = "2024"
description = "Collaborative multi-context language models with native GGUF inference and local teacher distillation"
license = "MIT OR Apache-2.0"

[features]
default = []
native = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "performance"
harness = false

[profile.release]
debug = 1
